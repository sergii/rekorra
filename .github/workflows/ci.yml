name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/12
      REKORRA_RAILS_SERIES: ${{ matrix.rails }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        rails: ["8.0", "8.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Prepare demo database
        run: RAILS_ENV=test bundle exec rails db:prepare
        working-directory: test/dummy
      - name: Report resolved versions
        run: |
          bundle exec rails --version
          ruby --version
      - name: Run integration tests
        run: bundle exec rake test

  browser:
    name: Browser acceptance (Chrome)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/12
      RAILS_ENV: test
      RAILS_SYSTEM_TESTING_SCREENSHOT_HTML: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify Chrome is available
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Prepare demo database
        run: bundle exec rails db:prepare
        working-directory: test/dummy
      - name: Test real browser interaction and viewport layout
        run: bundle exec ruby -Itest test/browser/resource_index_browser.rb
      - name: Upload browser screenshots and failure HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rekorra-browser-acceptance
          path: |
            test/dummy/tmp/screenshots/
            tmp/screenshots/
          if-no-files-found: warn

  package:
    name: Installed gem in independent Rails host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build distributable gem and inspect package contents
        run: |
          gem build rekorra.gemspec --output "$RUNNER_TEMP/rekorra-built.gem"
          gem install --local "$RUNNER_TEMP/rekorra-built.gem" --install-dir "$RUNNER_TEMP/packaged-gems" --no-document --ignore-dependencies
      - name: Boot a separate Rails app with the installed gem
        run: |
          export GEM_PATH="$(bundle exec ruby -e 'puts Gem.path.join(":")'):$RUNNER_TEMP/packaged-gems"
          cd "$RUNNER_TEMP"
          env -u BUNDLE_GEMFILE -u RUBYOPT GEM_PATH="$GEM_PATH" ruby "$GITHUB_WORKSPACE/test/packaging/external_host_smoke.rb"

  postgresql:
    name: PostgreSQL host (Rails 8.1 / Ruby 3.4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rekorra
          POSTGRES_PASSWORD: rekorra_ci_only
          POSTGRES_DB: rekorra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekorra -d rekorra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REKORRA_RAILS_SERIES: "8.1"
      REKORRA_TEST_DATABASE_URL: postgresql://rekorra:rekorra_ci_only@127.0.0.1:5432/rekorra_test
      REDIS_URL: redis://127.0.0.1:6379/12
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Show database and framework versions
        run: |
          bundle exec rails --version
          bundle exec ruby -rpg -e 'puts "PostgreSQL driver #{PG.library_version}"'
      - name: Prepare Rails demo with PostgreSQL primary and SQLite queue
        run: bundle exec rails db:prepare
        working-directory: test/dummy
      - name: Verify real PostgreSQL host connection
        run: |
          bundle exec rails runner 'abort "Expected PostgreSQL" unless ActiveRecord::Base.connection.adapter_name == "PostgreSQL"; puts "Primary: #{ActiveRecord::Base.connection.adapter_name}"'
        working-directory: test/dummy
      - name: Run full scoped CRUD, Activity, Jobs, Index and cursor test suite
        run: bundle exec rake test

  mysql:
    name: MySQL 8.4 host (Rails 8.1 / Ruby 3.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rekorra_test
          MYSQL_USER: rekorra
          MYSQL_PASSWORD: rekorra_ci_only
          MYSQL_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_ci_only"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REKORRA_RAILS_SERIES: "8.1"
      REKORRA_TEST_DATABASE_URL: mysql2://rekorra:rekorra_ci_only@127.0.0.1:3306/rekorra_test?encoding=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/12
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Report resolved versions
        run: |
          bundle exec rails --version
          bundle exec ruby -rmysql2 -e 'puts "MySQL client #{Mysql2::Client.info}"'
      - name: Prepare MySQL primary and SQLite queue
        run: bundle exec rails db:prepare
        working-directory: test/dummy
      - name: Verify real MySQL host connection
        run: |
          bundle exec rails runner 'abort "Expected Mysql2" unless ActiveRecord::Base.connection.adapter_name == "Mysql2"; puts "Primary: #{ActiveRecord::Base.connection.adapter_name}"'
        working-directory: test/dummy
      - name: Run full integration tests including 50k users
        run: bundle exec rake test
